# Config de Eclipse Mosquitto para el broker compartido en la VM de la cátedra.
#
# Distinta de services/broker/mosquitto.conf de starlink-measurement-station: ese
# broker vive solo en la red Docker/LAN (ADR-14 de ese repo dice explícitamente que
# por eso no necesita auth). Este SÍ se expone con IP pública -- allow_anonymous
# true acá sería publicar el broker compartido a cualquiera en internet. Ver
# docs/01_ADR.md de este repo.

listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwordfile
